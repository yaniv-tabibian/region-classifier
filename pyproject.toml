[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "region-classifier"
version = "0.1.0"
description = "Real-time In A / In B / Outside classification of a moving GPS sensor from shortest-distance-to-boundary streams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yaniv Tabibian" }]
dependencies = ["numpy>=1.23", "PyYAML>=6.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8", "black>=24.0"]

[project.scripts]
region-sim = "region_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
region_classifier = ["py.typed", "data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# tools/ holds the standalone verification harnesses, kept close to how they were
# authored so they stay checkable line-by-line against docs/DECISION_RULE.md: the
# aligned one-line branches (E701) mirror the rule table row-for-row, and the wide
# diagnostic print()s (E501) keep each test's output on one line.
"tools/*" = ["E501", "E701"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
packages = ["region_classifier"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The newest numpy stubs use PEP 695 `type X = ...` (valid only on 3.12+), which
# mypy rejects while parsing numpy under our 3.10 target. We don't type-check
# numpy's internals anyway, so skip following it.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
