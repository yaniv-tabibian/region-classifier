# Two adjacent rectangular regions that SHARE an edge (the interview geometry):
# A occupies x in [-20, 0], B occupies x in [0, 20]; they touch at x = 0.
# Crossing the shared edge is a direct A <-> B transition.
seed: 7
dt: 0.1
duration_s: 120
pasture: {xmin: -40, ymin: -25, xmax: 40, ymax: 25}

regions:
  A: {type: rectangle, center: [-10, 0], width: 20, height: 40}
  B: {type: rectangle, center: [10, 0], width: 20, height: 40}

motion:
  mean_speed: 3.0
  speed_sigma: 1.5
  turn_sigma: 0.4

noise:
  distance_std: 0.0
